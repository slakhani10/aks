name: Deploy secure AKS environment

on:
  workflow_dispatch:
    inputs:
      resource_group:
        description: "Existing resource group (also used as the naming prefix and region)"
        required: true
        type: string
      system_node_vm_size:
        description: "System node pool VM SKU"
        required: true
        default: "Standard_B2as_v2"
        type: string
      system_node_count:
        description: "System node pool node count"
        required: true
        default: 3
        type: number
      user_node_vm_size:
        description: "User node pool VM SKU (empty = same as system)"
        required: false
        default: ""
        type: string
      user_node_count:
        description: "User node pool node count"
        required: true
        default: 2
        type: number
      aks_vnet_cidr:
        description: "AKS vNet CIDR (/16-/22). Node, private endpoint and App Gateway for Containers subnets are derived from it"
        required: true
        default: "10.0.0.0/22"
        type: string
      action:
        description: "plan = preview only, apply = apply the reviewed plan, destroy = plan + apply a destroy"
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - apply
          - destroy
      runner:
        description: "Where Plan/Apply run. self-hosted = private runner from 'Deploy private GitHub runner' (also peers its vNet)"
        required: true
        default: "github-hosted"
        type: choice
        options:
          - github-hosted
          - self-hosted
      deploy_sample_app:
        description: "Deploy the smoke-test app behind the App Gateway after apply"
        required: false
        default: false
        type: boolean
  pull_request:
    paths:
      - "terraform/**"
      - "k8s/**"
      - ".github/workflows/deploy-aks.yml"

permissions:
  contents: read
  id-token: write # OIDC federation to Entra ID - no client secrets stored in GitHub

concurrency:
  # One run per resource group at a time (Terraform state is also locked via blob lease).
  group: aks-${{ inputs.resource_group || github.ref }}
  cancel-in-progress: false

env:
  TF_VERSION: "1.13.4"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  WORKDIR: terraform
  ALB_CONTROLLER_VERSION: "1.13.0" # App Gateway for Containers ALB Controller Helm chart
  # azurerm provider + backend authentication via GitHub OIDC
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

jobs:
  # ---------------------------------------------------------------------------
  lint:
    name: fmt & validate
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash # explicit bash = "-eo pipefail", so failures in pipes fail the step
        working-directory: ${{ env.WORKDIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform fmt
        run: terraform fmt -check -recursive

      - name: terraform validate
        run: |
          terraform init -backend=false
          terraform validate

      - name: terraform test (offline, mocked provider)
        run: terraform test

  # ---------------------------------------------------------------------------
  plan:
    name: Plan
    if: github.event_name == 'workflow_dispatch'
    needs: lint
    # self-hosted targets the private runner registered with this resource group as a label
    runs-on: ${{ inputs.runner == 'self-hosted' && fromJSON(format('["self-hosted","{0}"]', inputs.resource_group)) || 'ubuntu-latest' }}
    environment: azure-preview
    defaults:
      run:
        shell: bash # explicit bash = "-eo pipefail", so failures in pipes fail the step
        working-directory: ${{ env.WORKDIR }}
    env:
      RG: ${{ inputs.resource_group }}
      TF_VAR_resource_group_name: ${{ inputs.resource_group }}
      TF_VAR_system_node_vm_size: ${{ inputs.system_node_vm_size }}
      TF_VAR_system_node_count: ${{ inputs.system_node_count }}
      TF_VAR_user_node_vm_size: ${{ inputs.user_node_vm_size }}
      TF_VAR_user_node_count: ${{ inputs.user_node_count }}
      TF_VAR_aks_vnet_cidr: ${{ inputs.aks_vnet_cidr }}
      # Peer the private runner vNet (created by deploy-runner.yml) when running on it.
      TF_VAR_runner_vnet_name: ${{ inputs.runner == 'self-hosted' && format('{0}-vnet-runner', inputs.resource_group) || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Check resource group exists
        run: |
          if [ "$(az group exists --name "$RG")" != "true" ]; then
            echo "::error::Resource group '$RG' does not exist. This workflow never creates resource groups."
            exit 1
          fi
          echo "Region: $(az group show -n "$RG" --query location -o tsv)"

      - name: Optional pod / service CIDRs (repository variables)
        env:
          POD_CIDR: ${{ vars.AKS_POD_CIDR }}
          SERVICE_CIDR: ${{ vars.AKS_SERVICE_CIDR }}
        run: |
          # Unset variables keep the Terraform defaults (10.244.0.0/16 and 172.16.0.0/16).
          if [ -n "$POD_CIDR" ];     then echo "TF_VAR_pod_cidr=$POD_CIDR"         >> "$GITHUB_ENV"; fi
          if [ -n "$SERVICE_CIDR" ]; then echo "TF_VAR_service_cidr=$SERVICE_CIDR" >> "$GITHUB_ENV"; fi

      - name: Check encryption-at-host feature
        run: |
          # Encryption at host requires a subscription feature flag.
          STATE=$(az feature show --namespace Microsoft.Compute --name EncryptionAtHost \
                    --query properties.state -o tsv 2>/dev/null || echo "Unknown")
          case "$STATE" in
            Registered) echo "TF_VAR_enable_encryption_at_host=true" >> "$GITHUB_ENV" ;;
            Unknown)    echo "::notice::Cannot read EncryptionAtHost feature state (insufficient permissions?). Assuming it is registered."
                        echo "TF_VAR_enable_encryption_at_host=true" >> "$GITHUB_ENV" ;;
            *)          echo "::warning::Microsoft.Compute/EncryptionAtHost is '$STATE'. Deploying WITHOUT encryption at host. Run 'az feature register --namespace Microsoft.Compute --name EncryptionAtHost' and re-run."
                        echo "TF_VAR_enable_encryption_at_host=false" >> "$GITHUB_ENV" ;;
          esac

      - name: terraform init
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.TFSTATE_CONTAINER || 'tfstate' }}" \
            -backend-config="key=${RG}.tfstate"

      - name: terraform plan
        run: |
          DESTROY_FLAG=""
          if [ "${{ inputs.action }}" = "destroy" ]; then DESTROY_FLAG="-destroy"; fi

          # Capture terraform's own exit code; piping into tee would otherwise hide failures.
          set +e
          terraform plan $DESTROY_FLAG -out=tfplan -no-color 2>&1 | tee plan.txt
          PLAN_EXIT=${PIPESTATUS[0]}
          set -e

          if [ "$PLAN_EXIT" -ne 0 ]; then
            # Never hand an incomplete plan to the apply job.
            rm -f tfplan
            {
              echo "## ❌ Terraform plan failed for \`$RG\`"
              echo '```'
              grep -A12 -E '^(Error|│ Error)' plan.txt | head -n 80
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::terraform plan failed (exit $PLAN_EXIT). See the errors above or in the run summary."
            exit "$PLAN_EXIT"
          fi

          {
            echo "## Terraform plan (${{ inputs.action }}) for \`$RG\`"
            echo '```'
            grep -E '^(Plan:|No changes|  # )' plan.txt | tail -n 80
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The reviewed plan is applied as-is by the next job. It contains resource
      # attributes (no secrets are generated by this configuration); keep retention short.
      - name: Upload plan
        if: inputs.action != 'plan'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ github.run_id }}
          path: ${{ env.WORKDIR }}/tfplan
          retention-days: 1
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  apply:
    name: Apply
    if: github.event_name == 'workflow_dispatch' && inputs.action != 'plan'
    needs: plan
    # self-hosted targets the private runner registered with this resource group as a label
    runs-on: ${{ inputs.runner == 'self-hosted' && fromJSON(format('["self-hosted","{0}"]', inputs.resource_group)) || 'ubuntu-latest' }}
    # Configure required reviewers on this environment to gate changes.
    environment: azure-production
    defaults:
      run:
        shell: bash # explicit bash = "-eo pipefail", so failures in pipes fail the step
        working-directory: ${{ env.WORKDIR }}
    env:
      RG: ${{ inputs.resource_group }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Download plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ github.run_id }}
          path: ${{ env.WORKDIR }}

      - name: terraform init
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.TFSTATE_CONTAINER || 'tfstate' }}" \
            -backend-config="key=${RG}.tfstate"

      # Migration from the earlier App Gateway (WAF_v2) design: the old smoke-test
      # Service holds an internal load balancer IP in the subnet Terraform is about
      # to delete, which would fail with InUseSubnetCannotBeDeleted. Idempotent.
      - name: Remove legacy internal load balancer Service (migration)
        if: inputs.action == 'apply'
        working-directory: .
        run: |
          AKS_NAME="$(echo "$RG" | tr '[:upper:]' '[:lower:]')-aks"
          if az aks show -g "$RG" -n "$AKS_NAME" --query id -o tsv >/dev/null 2>&1; then
            AKS_INVOKE_ATTEMPTS=2 .github/scripts/aks-invoke.sh "$RG" "$AKS_NAME" \
              "kubectl -n sample-app get svc hello -o jsonpath='{.spec.type}' 2>/dev/null | grep -q LoadBalancer \
                 && kubectl -n sample-app delete svc hello --wait=true || echo 'no legacy LoadBalancer Service'" \
              || echo "::warning::Could not check for the legacy smoke-test Service"
          else
            echo "Cluster $AKS_NAME does not exist yet - nothing to migrate"
          fi

      - name: terraform apply
        run: terraform apply -no-color tfplan

      - name: Outputs
        id: out
        if: inputs.action == 'apply'
        run: |
          terraform output -json > outputs.json
          for key in aks_name agc_id agc_frontend_name agc_frontend_fqdn waf_policy_id alb_controller_client_id alb_controller_namespace; do
            echo "$key=$(jq -r ".${key}.value" outputs.json)" >> "$GITHUB_OUTPUT"
          done
          {
            echo "## Deployed \`$RG\`"
            echo "| Output | Value |"
            echo "|---|---|"
            jq -r 'to_entries[] | "| \(.key) | \(.value.value) |"' outputs.json
          } >> "$GITHUB_STEP_SUMMARY"

      # The CLI session from the first login holds a GitHub OIDC client assertion
      # that Entra ID accepts for only ~5 minutes. terraform apply takes longer,
      # and `az aks command invoke` must then fetch a NEW token (AKS/Entra audience),
      # which fails with AADSTS700024 unless we sign in again right here.
      - name: Azure login (refresh after terraform apply)
        if: inputs.action == 'apply'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Cluster-side half of App Gateway for Containers: the ALB Controller (Helm, with
      # workload identity) plus the platform Gateway and its WAF policy. Idempotent.
      - name: Install ALB Controller and WAF-protected Gateway
        if: inputs.action == 'apply'
        working-directory: .
        env:
          AKS_NAME: ${{ steps.out.outputs.aks_name }}
          AGC_ID: ${{ steps.out.outputs.agc_id }}
          AGC_FRONTEND_NAME: ${{ steps.out.outputs.agc_frontend_name }}
          WAF_POLICY_ID: ${{ steps.out.outputs.waf_policy_id }}
          ALB_CLIENT_ID: ${{ steps.out.outputs.alb_controller_client_id }}
          ALB_NAMESPACE: ${{ steps.out.outputs.alb_controller_namespace }}
        run: |
          set -euo pipefail
          mkdir -p invoke
          envsubst '${AGC_ID} ${AGC_FRONTEND_NAME} ${WAF_POLICY_ID}' < k8s/platform/gateway.yaml > invoke/gateway.yaml

          INVOKE=.github/scripts/aks-invoke.sh
          # Each call is kept to about a minute: command invoke is not meant for long
          # blocking commands. Waits are short checks that the helper polls.

          echo "::group::1/4 Install or upgrade ALB Controller $ALB_CONTROLLER_VERSION"
          $INVOKE "$RG" "$AKS_NAME" "helm upgrade --install alb-controller \
              oci://mcr.microsoft.com/application-lb/charts/alb-controller \
              --version $ALB_CONTROLLER_VERSION \
              --set albController.namespace=$ALB_NAMESPACE \
              --set albController.podIdentity.clientID=$ALB_CLIENT_ID"
          echo "::endgroup::"

          echo "::group::2/4 Wait for the controller and its CRDs"
          AKS_INVOKE_ATTEMPTS=20 AKS_INVOKE_DELAY=15 $INVOKE "$RG" "$AKS_NAME" \
            "kubectl -n $ALB_NAMESPACE rollout status deploy/alb-controller --timeout=45s \
             && kubectl get crd gateways.gateway.networking.k8s.io webapplicationfirewallpolicies.alb.networking.azure.io"
          echo "::endgroup::"

          echo "::group::3/4 Apply the platform Gateway and WAF policy"
          $INVOKE "$RG" "$AKS_NAME" "kubectl apply -f gateway.yaml" invoke/gateway.yaml
          echo "::endgroup::"

          echo "::group::4/4 Wait until the Gateway is Programmed on App Gateway for Containers"
          AKS_INVOKE_ATTEMPTS=30 AKS_INVOKE_DELAY=20 $INVOKE "$RG" "$AKS_NAME" \
            "kubectl -n ingress wait gateway/agc-gateway --for=condition=Programmed --timeout=45s \
             && kubectl -n ingress get gateway agc-gateway -o wide \
             && kubectl -n ingress get webapplicationfirewallpolicy"
          echo "::endgroup::"

      - name: Deploy smoke-test app (HTTPRoute on the Gateway)
        if: inputs.action == 'apply' && inputs.deploy_sample_app
        working-directory: .
        env:
          AKS_NAME: ${{ steps.out.outputs.aks_name }}
        run: |
          set -euo pipefail
          INVOKE=.github/scripts/aks-invoke.sh
          $INVOKE "$RG" "$AKS_NAME" "kubectl apply -f sample-app.yaml" k8s/sample-app.yaml
          AKS_INVOKE_ATTEMPTS=12 AKS_INVOKE_DELAY=15 $INVOKE "$RG" "$AKS_NAME" \
            "kubectl -n sample-app rollout status deploy/hello --timeout=45s \
             && kubectl -n sample-app get httproute,svc,endpoints,pods -o wide"

      - name: Verify traffic flows through the WAF
        if: inputs.action == 'apply' && inputs.deploy_sample_app
        env:
          FQDN: ${{ steps.out.outputs.agc_frontend_fqdn }}
        run: |
          set -euo pipefail
          # Route programming can take a couple of minutes after the HTTPRoute is accepted.
          for attempt in $(seq 1 20); do
            code=$(curl -s -o /dev/null -m 10 -w "%{http_code}" "http://$FQDN/" || true)
            echo "GET http://$FQDN/ -> HTTP $code"
            if [ "$code" = "200" ]; then
              # The WAF (Prevention mode) must block an obvious attack.
              code=$(curl -s -o /dev/null -m 10 -w "%{http_code}" "http://$FQDN/?id=1%27%20OR%20%271%27=%271" || true)
              echo "SQL-injection probe returned HTTP $code (expected 403 from the WAF)"
              [ "$code" = "403" ] || { echo "::error::WAF did not block the test attack"; exit 1; }
              echo "## Smoke test passed: http://$FQDN/ (WAF blocks attacks)" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 30
          done
          echo "::error::http://$FQDN/ did not return 200 (see diagnostics below)"
          exit 1

      - name: Diagnostics (on failure)
        if: failure() && inputs.action == 'apply' && steps.out.outputs.aks_name != ''
        working-directory: .
        env:
          AKS_NAME: ${{ steps.out.outputs.aks_name }}
          ALB_NAMESPACE: ${{ steps.out.outputs.alb_controller_namespace }}
        run: |
          AKS_INVOKE_ATTEMPTS=1 .github/scripts/aks-invoke.sh "$RG" "$AKS_NAME" "\
            kubectl get gateway,httproute -A -o wide; \
            kubectl -n ingress describe gateway agc-gateway | tail -n 40; \
            kubectl -n sample-app describe httproute hello | tail -n 30; \
            kubectl -n sample-app get svc,endpoints,pods -o wide; \
            kubectl -n sample-app logs deploy/hello --tail=30; \
            kubectl -n $ALB_NAMESPACE get pods -o wide; \
            kubectl -n $ALB_NAMESPACE logs deploy/alb-controller --tail=60; \
            kubectl get events -A --sort-by=.lastTimestamp | tail -n 30" || true
