# Smoke-test workload exposed ONLY on the AKS internal load balancer.
# ${INGRESS_IP} and ${INGRESS_SUBNET} are substituted by the workflow (envsubst)
# with the deployment outputs; App Gateway's backend pool already points at that IP.
#
# For real workloads, replace this with an ingress controller (e.g. ingress-nginx or
# the AKS application routing add-on) whose Service uses the same annotations.
apiVersion: v1
kind: Namespace
metadata:
  name: sample-app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello
  namespace: sample-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hello
  template:
    metadata:
      labels:
        app: hello
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hello
          # Microsoft's ASP.NET sample: runs as a non-root user and listens on 8080,
          # so it needs no extra Linux capabilities.
          image: mcr.microsoft.com/dotnet/samples:aspnetapp
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # Pods only count as ready (and receive traffic) once the app answers HTTP.
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: hello
  namespace: sample-app
  annotations:
    service.beta.kubernetes.io/azure-load-balancer-internal: "true"
    service.beta.kubernetes.io/azure-load-balancer-internal-subnet: "${INGRESS_SUBNET}"
    service.beta.kubernetes.io/azure-load-balancer-ipv4: "${INGRESS_IP}"
spec:
  type: LoadBalancer
  selector:
    app: hello
  ports:
    - name: http
      port: 80 # App Gateway backend: ${INGRESS_IP}:80
      targetPort: http
---
# Default-deny ingress for the namespace, then allow only HTTP to the app.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: sample-app
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-http-to-hello
  namespace: sample-app
spec:
  podSelector:
    matchLabels:
      app: hello
  policyTypes: ["Ingress"]
  ingress:
    - ports:
        - protocol: TCP
          port: 8080 # policy applies to the pod port (after the Service maps 80 -> 8080)
