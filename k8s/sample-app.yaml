# Smoke-test workload published through App Gateway for Containers (+ WAF).
# It is NOT exposed on any load balancer: the HTTPRoute attaches it to the
# platform Gateway (k8s/platform/gateway.yaml) and AGfC proxies straight to the
# pods. Use this as the template for real workloads.
apiVersion: v1
kind: Namespace
metadata:
  name: sample-app
  labels:
    agc-routes: allowed # lets HTTPRoutes in this namespace attach to the platform Gateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello
  namespace: sample-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hello
  template:
    metadata:
      labels:
        app: hello
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hello
          # Microsoft's ASP.NET sample: runs as a non-root user and listens on 8080,
          # so it needs no extra Linux capabilities.
          image: mcr.microsoft.com/dotnet/samples:aspnetapp
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # Pods only count as ready (and receive traffic) once the app answers HTTP.
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: hello
  namespace: sample-app
spec:
  type: ClusterIP
  selector:
    app: hello
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hello
  namespace: sample-app
spec:
  parentRefs:
    - name: agc-gateway
      namespace: ingress
      sectionName: http
  rules:
    - backendRefs:
        - name: hello
          port: 80
---
# Default-deny ingress for the namespace, then allow only HTTP to the app.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: sample-app
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-http-to-hello
  namespace: sample-app
spec:
  podSelector:
    matchLabels:
      app: hello
  policyTypes: ["Ingress"]
  ingress:
    - ports:
        - protocol: TCP
          port: 8080 # App Gateway for Containers connects to the pod port directly
